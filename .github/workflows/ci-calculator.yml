# CI Calculator - Lab 7
# Keeps the Lab5 unit-test steps and adds a Docker Compose build validation job.
name: CI Calculator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# -------------------------------------------------------------------
# Job 1: backend unit tests (original Lab5 test steps, moved to backend/)
# -------------------------------------------------------------------
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Compile backend
        working-directory: backend
        run: mvn clean compile

      - name: Run backend unit tests
        working-directory: backend
        run: mvn test

# -------------------------------------------------------------------
# Job 2: Docker Compose build validation
# Only validates that both images build and the compose file is valid.
# The containers are NOT kept running in CI.
# -------------------------------------------------------------------
  compose-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build all images with Docker Compose
        run: docker compose build
