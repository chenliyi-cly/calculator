<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; display: flex;
               justify-content: center; padding-top: 80px; }
        .card { background: #fff; padding: 30px 36px; border-radius: 12px;
                box-shadow: 0 4px 16px rgba(0,0,0,.12); width: 340px; }
        h2 { margin-top: 0; text-align: center; }
        label { display: block; margin: 12px 0 4px; font-size: 14px; }
        input, select { width: 100%; box-sizing: border-box; padding: 8px;
                        border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        button { width: 100%; margin-top: 18px; padding: 10px; background: #2563eb;
                 color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
        #result { margin-top: 18px; font-size: 18px; text-align: center; color: #166534; }
    </style>
</head>
<body>
<div class="card">
    <h2>Calculator</h2>

    <label>First number</label>
    <input type="number" id="a" step="any" placeholder="e.g. 5">

    <label>Operator</label>
    <select id="op">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>

    <label>Second number</label>
    <input type="number" id="b" step="any" placeholder="e.g. 3">

    <button onclick="calculate()">Calculate</button>

    <div id="result"></div>
</div>

<script>
    // The browser calls the nginx frontend on the same origin; nginx reverse-proxies
    // /calculate to the backend service by its Compose service name "backend".
    const BACKEND_URL = "/calculate";

    async function calculate() {
        const a = document.getElementById("a").value;
        const b = document.getElementById("b").value;
        const op = document.getElementById("op").value;
        const resultBox = document.getElementById("result");

        // encodeURIComponent keeps "+" and other symbols safe in the query string
        const url = `${BACKEND_URL}?a=${encodeURIComponent(a)}`
                  + `&b=${encodeURIComponent(b)}&op=${encodeURIComponent(op)}`;

        try {
            const response = await fetch(url);
            const data = await response.json();
            if (data.error) {
                resultBox.style.color = "#b91c1c";
                resultBox.textContent = "Error: " + data.error;
            } else {
                resultBox.style.color = "#166534";
                resultBox.textContent = `${a} ${op} ${b} = ${data.result}`;
            }
        } catch (err) {
            resultBox.style.color = "#b91c1c";
            resultBox.textContent = "Cannot reach backend: " + err;
        }
    }
</script>
</body>
</html>
