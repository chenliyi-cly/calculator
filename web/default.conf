# Nginx configuration for the frontend static web service.
server {
    listen 80;
    server_name localhost;

    # Serve the static HTML page
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Reverse proxy: forward /calculate requests to the backend service.
    # Inside the Compose network, "backend" resolves to the backend container.
    location /calculate {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
